name: Generate GitHub Trophy

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Anubhav2912
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move trophy to profile folder
        run: |
          mkdir -p profile
          mv trophy.svg profile/trophy.svg

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          git diff --cached --quiet || git commit -m "Update GitHub achievements"

          git push

name: Generate GitHub Trophy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Clone GitHub Profile Trophy
        run: |
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git trophy-generator

      - name: Generate trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile

          cd trophy-generator

          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            ./render_svg.ts \
            Anubhav2912 \
            ../profile \
            darkhub

      - name: Show generated files
        run: |
          echo "Generated files:"
          find profile -maxdepth 2 -type f -print

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub achievements"
            git push
          fi
